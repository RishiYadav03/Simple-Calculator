<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('cal.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            min-height: 100vh;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            border-radius: 1.5rem;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card overlay text-white shadow">
                    <div class="d-flex align-items-center mb-3">
                        <img src="logo.jpg" class="img-fluid me-3" style="width: 60px;" alt="Logo">
                        <h4 class="mb-0">Simple Calculator</h4>
                    </div>

                    <div class="mb-3">
                        <label for="Number1Input" class="form-label">Enter Number 1:</label>
                        <input type="number" class="form-control" id="Number1Input" placeholder="e.g. 10">
                    </div>

                    <div class="mb-3">
                        <label for="Number2Input" class="form-label">Enter Number 2:</label>
                        <input type="number" class="form-control" id="Number2Input" placeholder="e.g. 20">
                    </div>

                    <div class="d-flex flex-wrap justify-content-between gap-2">
                        <button id="x1" class="btn btn-secondary flex-fill">Add</button>
                        <button id="x2" class="btn btn-secondary flex-fill">Subtract</button>
                        <button id="x3" class="btn btn-secondary flex-fill">Multiply</button>
                        <button id="x4" class="btn btn-secondary flex-fill">Divide</button>
                    </div>

                    <div class="mt-3 text-center">
                        <p id="errMsg" class="fw-bold text-success"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="Simple_Calculator.js" type="module"></script>
</body>
</html>
